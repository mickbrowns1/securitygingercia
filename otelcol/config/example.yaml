# Example config for sgcia's OTel-based collector engine (otelcol/dist/sgcia-otelcol).
# Linux/macOS variant -- no windows_event_log receiver, since that receiver
# only runs on an actual Windows host (the collector refuses to start a
# pipeline using it anywhere else). Running on Windows instead? Start from
# example-windows.yaml, which is this same file plus that one receiver and
# its pipeline -- see MANUAL.md's Windows section.
#
# Validate with:  ./dist/sgcia-otelcol validate --config file:config/example.yaml
# Run with:       ./dist/sgcia-otelcol         --config file:config/example.yaml
#
# Secrets referenced as ${VAR} below (S1_HEC_TOKEN, SPLUNK_HEC_TOKEN,
# DATASET_API_KEY) are read from the environment at load time via the
# built-in env provider -- see README.md for how to supply them.
#
# This mirrors the three pipelines in ../../configs/example.yaml (syslog,
# file, Windows Event Log -> SentinelOne + Splunk HEC), translated to real
# OTel Collector shape, plus a fourth syslog pipeline (logs/syslog5424)
# added to demonstrate RFC 5424 alongside RFC 3164 -- see the note on
# syslog/rfc5424 below and README.md's Troubleshooting section for why
# these are two separate receivers rather than one receiver switched to
# a different protocol:
#   - each receiver owns its own inline `operators:` list (stanza vocabulary)
#     instead of a shared top-level `operators:` section.
#   - checkpoint/bookmark persistence is a `storage:` extension reference
#     (file_storage), not a per-receiver file path.
#   - `sourcetype`/`datasource`/`msgid` are set as plain attributes via an
#     `add` operator and deliberately left OUT of splunkhecexporter's
#     `otel_attrs_to_hec_metadata` map, so they land in the HEC event's
#     nested `fields{}` object rather than becoming top-level envelope keys
#     -- this is what makes the stock exporter produce the same
#     {time, host, event, fields} shape the Rust HEC exporters did.

extensions:
  file_storage:
    directory: /var/lib/sgcia/otelcol-storage
    create_directory: true

  health_check:
    endpoint: 127.0.0.1:13133

  statuscfg:
    # 127.0.0.1:7801 matches the Rust dashboard/editor's existing default
    # --status-addr, so `sgcia dashboard` / `sgcia edit` work against this
    # binary with no flags and no Rust code changes.
    endpoint: 127.0.0.1:7801
    config_path: ./config/example.yaml
    metrics_url: http://127.0.0.1:8888/metrics
    # Optional fleet management enrollment -- uncomment to report this
    # agent's health/inventory to a central sgcia-fleet-server over OpAMP
    # (outbound-only, no inbound port opens on this host). Off by default;
    # see README.md's "Fleet management" section before enabling.
    # fleet_server_url: ws://fleet.example.com:4320/v1/opamp
    # fleet_token: ${FLEET_TOKEN}

receivers:
  syslog/udp:
    protocol: rfc3164
    udp:
      listen_address: "0.0.0.0:514"
    operators:
      - type: regex_parser
        id: extract_asa_fields
        parse_from: body
        parse_to: attributes
        regex: '^%ASA-(?P<severity>\d)-(?P<msgid>\d+):\s*(?P<message>.*)$'
        on_error: send_quiet
      - type: severity_parser
        id: map_severity
        parse_from: attributes.severity
        preset: default
        on_error: send_quiet
      - type: add
        id: add_datasource
        field: attributes.datasource
        value: "cisco_asa"
      - type: add
        id: add_sourcetype
        field: attributes.sourcetype
        value: "cisco_asa_ts_parser" # convention: <product>_ts_parser
      - type: move
        id: move_message_to_body
        from: attributes.message
        to: body

  syslog/tcp:
    protocol: rfc3164
    tcp:
      listen_address: "0.0.0.0:601"
    enable_octet_counting: true # RFC 6587 octet counting (TCP only)
    operators:
      - type: regex_parser
        id: extract_asa_fields
        parse_from: body
        parse_to: attributes
        regex: '^%ASA-(?P<severity>\d)-(?P<msgid>\d+):\s*(?P<message>.*)$'
        on_error: send_quiet
      - type: severity_parser
        id: map_severity
        parse_from: attributes.severity
        preset: default
        on_error: send_quiet
      - type: add
        id: add_datasource
        field: attributes.datasource
        value: "cisco_asa"
      - type: add
        id: add_sourcetype
        field: attributes.sourcetype
        value: "cisco_asa_ts_parser"
      - type: move
        id: move_message_to_body
        from: attributes.message
        to: body

  # Demonstrates the *other* half of the syslog RFC split covered in
  # README.md's Troubleshooting section: RFC 5424 (2009) is what most
  # modern senders actually emit today -- a current util-linux `logger`,
  # rsyslog's own default remote-forwarding template -- not the older
  # RFC 3164 the syslog/udp and syslog/tcp receivers above expect (those
  # model a Cisco ASA, which predates RFC 5424 and never sends it).
  # RFC 5424's envelope is already structured (version, hostname,
  # app-name, proc-id, msg-id, structured-data), so unlike the ASA
  # pipeline above, no regex_parser is needed to pull fields out of the
  # message body -- the receiver extracts them into attributes.message
  # on its own. The `move` below is still required, though: the receiver
  # leaves `body` as the *entire* raw line (version/hostname/structured-
  # data and all) regardless of protocol, only ever populating
  # attributes.message with the clean text -- moving it into body is
  # what the ASA pipeline's own `move` step does too, just fed by a
  # regex_parser capture group there instead of the receiver itself.
  syslog/rfc5424:
    protocol: rfc5424
    udp:
      listen_address: "0.0.0.0:1514"
    operators:
      - type: add
        id: add_datasource
        field: attributes.datasource
        value: "linux_host"
      - type: add
        id: add_sourcetype
        field: attributes.sourcetype
        value: "linux_rsyslog"
      - type: move
        id: move_message_to_body
        from: attributes.message
        to: body

  file_log/app:
    include: ["/var/log/myapp/*.log"]
    exclude: ["/var/log/myapp/*.gz"]
    start_at: end # beginning | end
    poll_interval: 500ms
    storage: file_storage
    operators:
      - type: add
        id: add_sourcetype
        field: attributes.sourcetype
        value: "myapp"
      # datasetexporter (below) routes events by a literal `serverHost`
      # attribute -- unlike splunkhecexporter, it has no config-driven
      # attribute-to-metadata mapping, so an `add` operator like this is
      # the only way to set it per-event without an upstream processor
      # (which this distribution doesn't use).
      - type: add
        id: add_server_host
        field: attributes.serverHost
        value: "myapp-host"

exporters:
  splunk_hec/sentinelone:
    endpoint: "https://ingest.na1.sentinelone.net/services/collector"
    token: ${S1_HEC_TOKEN}
    # Leave source/sourcetype/index unmapped below -- since no attribute
    # literally named com.splunk.source/sourcetype/index exists on our log
    # records, those top-level HEC fields stay omitted, and the plain
    # `sourcetype`/`datasource` attributes set by the `add` operators above
    # fall through into the event's nested `fields{}` map instead.
    otel_attrs_to_hec_metadata:
      source: ""
      sourcetype: ""
      index: ""
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 500ms
      max_interval: 30s

  splunk_hec/splunk:
    endpoint: "https://splunk.example.com:8088/services/collector/event"
    token: ${SPLUNK_HEC_TOKEN}
    index: main
    otel_attrs_to_hec_metadata:
      source: ""
      sourcetype: ""
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000

  # SentinelOne Singularity Data Lake (formerly Scalyr/DataSet). Alpha
  # stability upstream. Unlike splunkhecexporter, this exporter has no
  # config-driven attribute-to-metadata mapping -- the only routing
  # metadata it reads is a literal `serverHost` attribute (see the `add`
  # operator on file_log/app above), checked in this order: the event's
  # own serverHost attribute, then the resource's serverHost or
  # host.name, then server_host.server_host below, then (if
  # use_hostname is true) this collector's own OS hostname.
  dataset/sdl:
    dataset_url: https://app.scalyr.com # https://app.eu.scalyr.com for the EU instance
    api_key: ${DATASET_API_KEY}
    server_host:
      use_hostname: true

  # Feeds the web UI's log viewer (part of the statuscfg extension below)
  # -- POSTs a JSON copy of each log record over loopback to statuscfg's
  # own /internal/logs route, which keeps them in a small in-memory
  # ring buffer. Endpoint must match statuscfg.endpoint above. Purely
  # local visibility, not a real destination -- safe to add to every
  # logs pipeline alongside the actual exporters.
  logbuffer:
    endpoint: http://127.0.0.1:7801

service:
  extensions: [file_storage, health_check, statuscfg]
  pipelines:
    logs/syslog:
      receivers: [syslog/udp, syslog/tcp]
      exporters: [splunk_hec/sentinelone, splunk_hec/splunk, logbuffer]

    logs/syslog5424:
      receivers: [syslog/rfc5424]
      exporters: [splunk_hec/sentinelone, splunk_hec/splunk, logbuffer]

    logs/files:
      receivers: [file_log/app]
      exporters: [splunk_hec/sentinelone, dataset/sdl, logbuffer]
