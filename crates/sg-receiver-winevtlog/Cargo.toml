[package]
name = "sg-receiver-winevtlog"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sg-core = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"

# NOTE: type-checked via `cargo check --target x86_64-pc-windows-msvc` (no
# Windows linker available here) but never actually run -- there is no live
# Event Log service, EvtSubscribe callback, or wevtapi.dll to exercise this
# against on macOS. Treat as unverified until run on a real Windows host or
# CI (e.g. GitHub Actions `windows-latest`).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_EventLog",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
] }
