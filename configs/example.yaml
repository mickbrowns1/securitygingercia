# Example config for Security Ginger Collect It All (sgcia).
#
# Validate with `sgcia check --config example.yaml`, or edit interactively
# with `sgcia edit --config example.yaml`. Secrets referenced below via
# the dollar-brace-VAR_NAME syntax (S1_HEC_TOKEN, SPLUNK_HEC_TOKEN) are
# read from the environment at load time -- see README.md for how to
# supply them.

receivers:
  syslog/udp:
    protocol: udp
    listen_address: "0.0.0.0:514"
    rfc: auto # auto | rfc3164 | rfc5424

  syslog/tcp:
    protocol: tcp
    listen_address: "0.0.0.0:601"
    rfc: auto
    framing: auto # auto | octet_counting | non_transparent
    max_message_size: 65536

  filelog/app:
    include: ["/var/log/myapp/*.log"]
    exclude: ["/var/log/myapp/*.gz"]
    start_at: end # beginning | end
    poll_interval: 500ms
    checkpoint_file: "/var/lib/sgcia/filelog-app.checkpoint.json"

  windows_eventlog/security:
    channel: "Security"
    query: "*"
    start_at: end
    bookmark_file: "C:\\ProgramData\\sgcia\\security.bookmark.xml"

operators:
  parse_kv:
    type: kv
    parse_from: body
    parse_to: attributes
    pair_delimiter: " "
    kv_delimiter: "="
    on_error: pass

  extract_asa_fields:
    type: regex
    parse_from: body
    parse_to: attributes
    pattern: '^%ASA-(?P<severity>\d)-(?P<msgid>\d+):\s*(?P<message>.*)$'
    on_error: pass

  map_severity:
    type: severity
    parse_from: attributes.severity
    preset: syslog
    on_error: pass

  parse_timestamp:
    type: timestamp
    parse_from: attributes.ts
    layout: rfc3339
    on_error: pass

  add_datasource:
    type: add
    field: attributes.datasource
    value: "cisco_asa"

  move_message_to_body:
    type: move
    from: attributes.message
    to: body

exporters:
  sentinelone_hec:
    type: s1hec
    endpoint: "https://xdr.us1.sentinelone.net/services/collector/event"
    token: ${S1_HEC_TOKEN}
    sourcetype: "cisco_asa_ts_parser" # convention: <product>_ts_parser
    datasource: "cisco_asa"
    msgid_field: attributes.msgid
    static_fields:
      tags: "prod-datacenter-1"
    batch: { max_events: 100, max_bytes: 1048576, flush_interval: 2s }
    retry: { max_attempts: 5, initial_backoff: 500ms, max_backoff: 30s }

  splunk_hec:
    type: splunkhec
    endpoint: "https://splunk.example.com:8088/services/collector/event"
    token: ${SPLUNK_HEC_TOKEN}
    source: "sgcia"
    sourcetype_field: attributes.sourcetype
    index: "main"
    batch: { max_events: 200, flush_interval: 2s }

service:
  pipelines:
    logs/syslog:
      receivers: [syslog/udp, syslog/tcp]
      operators:
        [
          parse_kv,
          extract_asa_fields,
          map_severity,
          parse_timestamp,
          add_datasource,
          move_message_to_body,
        ]
      exporters: [sentinelone_hec, splunk_hec]

    logs/files:
      receivers: [filelog/app]
      operators: [parse_timestamp]
      exporters: [sentinelone_hec]

    logs/windows:
      receivers: [windows_eventlog/security]
      operators: []
      exporters: [sentinelone_hec]
