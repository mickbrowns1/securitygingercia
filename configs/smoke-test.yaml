# Local smoke-test config: file + syslog receivers -> operator chain ->
# stdout exporter (no external HEC endpoint required). Used to manually
# verify the full config-driven run mode end-to-end.
receivers:
  filelog/smoke:
    include: ["./.smoke-test-data/*.log"]
    start_at: beginning
    poll_interval: 200ms
    checkpoint_file: "./.smoke-test-data/checkpoint.json"

operators:
  extract_asa_fields:
    type: regex
    pattern: '^%ASA-(?P<severity>\d)-(?P<msgid>\d+):\s*(?P<message>.*)$'
    parse_from: body
    parse_to: attributes
    on_error: pass

  add_datasource:
    type: add
    field: attributes.datasource
    value: "smoke_test"

exporters:
  debug_stdout:
    type: stdout

service:
  pipelines:
    logs/smoke:
      receivers: [filelog/smoke]
      operators: [extract_asa_fields, add_datasource]
      exporters: [debug_stdout]
